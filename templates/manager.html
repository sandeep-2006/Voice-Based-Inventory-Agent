<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manager Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f4f6f9; margin:0; }
    .topbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }
    h1 { color: #1976d2; margin:0; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background: #1976d2; color: white; }
    button {
      margin: 10px 0;
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #1976d2;
      color: white;
    }
    button:hover { background: #1565c0; }
    .logout-btn {
      background: #d32f2f;
    }
    .logout-btn:hover {
      background: #b71c1c;
    }
    .section { margin-top: 30px; }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Manager Dashboard</h1>
    <button class="logout-btn" onclick="window.location.href='/logout'">Logout</button>
  </div>

  <!-- Inventory Section -->
  <div class="section">
    <h2>Inventory</h2>
    <button onclick="fetchInventory()">Refresh Inventory</button>
    <table id="inventoryTable">
      <thead>
        <tr>
          <th>Item</th>
          <th>Quantity</th>
          <th>Unit</th>
        </tr>
      </thead>
      <tbody>
        {% for item in stock %}
          <tr>
            <td>{{ item[0] }}</td>
            <td>{{ item[1] }}</td>
            <td>{{ item[2] }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <!-- Voice Logs Section -->
  <div class="section">
    <h2>Voice Logs</h2>
    <button onclick="clearLogs()">Clear All Logs</button>
    <button onclick="fetchLogs()">Refresh Logs</button>
    <table id="logsTable">
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Raw Text</th>
          <th>Extracted Info</th>
        </tr>
      </thead>
      <tbody>
        {% for log in logs %}
          <tr>
            <td>{{ log[1] }}</td>
            <td>{{ log[2] }}</td>
            <td>{{ log[3] }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

<script>
async function fetchInventory() {
  const res = await fetch('/api/inventory');
  const data = await res.json();
  const tbody = document.querySelector("#inventoryTable tbody");
  tbody.innerHTML = '';
  data.forEach(item => {
    tbody.innerHTML += `<tr><td>${item.item}</td><td>${item.quantity}</td><td>${item.unit}</td></tr>`;
  });
}

async function fetchLogs() {
  const res = await fetch('/api/logs');
  const data = await res.json();
  const tbody = document.querySelector("#logsTable tbody");
  tbody.innerHTML = '';
  data.forEach(log => {
    tbody.innerHTML += `<tr><td>${log.timestamp}</td><td>${log.raw_text}</td><td>${log.extracted_info}</td></tr>`;
  });
}

async function clearLogs() {
  const res = await fetch('/api/clear_logs', { method: 'POST' });
  if(res.ok) {
    alert("All logs cleared!");
    fetchLogs();
  }
}
</script>

</body>
</html>
